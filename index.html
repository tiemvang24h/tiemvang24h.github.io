<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiệm Vàng – Giá vàng hôm nay & mẫu trang sức</title>
<meta name="description" content="Bảng giá vàng hôm nay và các mẫu trang sức vàng, bạc đang có tại tiệm.">
<meta name="theme-color" content="#1a120c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--nen:#fbf8f2;--the:#fff;--chu:#2a1f17;--mo:#7a6a5c;--vien:#ece3d4;--toi:#1a120c;--toi2:#2a1d14;
--vang:#b8892b;--vang2:#d9b25a;--vangsang:#f5e3a8;--vang-g:linear-gradient(135deg,#f7e7b0 0%,#dcb05a 42%,#a87a26 72%,#e8c878 100%);
--do:#9b1c1c;--len:#0f8a4b;--xuong:#c0262d;--r:16px;--bong:0 10px 30px -12px rgba(60,40,10,.22);
--serif:"Playfair Display",Georgia,"Times New Roman",serif;--sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--nen);color:var(--chu);font:15px/1.5 var(--sans)}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{max-width:100%;display:block}
.an{display:none!important}
.khung{max-width:1180px;margin:0 auto;padding:0 16px}
.vang-chu{background:var(--vang-g);-webkit-background-clip:text;background-clip:text;color:transparent}
.nut{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;font-weight:600;white-space:nowrap;transition:transform .15s,box-shadow .15s,background .15s}
.nut:active{transform:scale(.97)}
.nut-vang{background:var(--vang-g);color:#2b1c06;box-shadow:0 6px 18px -8px rgba(168,122,38,.9)}
.nut-toi{background:var(--toi);color:#f6e7c1}
.nut-vien{border:1.5px solid var(--vien);background:#fff}
.nut-zalo{background:#0068ff;color:#fff}
.nut svg{width:18px;height:18px;flex:none}
.nho{font-size:13px;color:var(--mo)}

/* ---------- đầu trang ---------- */
.dau{position:sticky;top:0;z-index:30;background:rgba(26,18,12,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#f3e6c8;border-bottom:1px solid rgba(217,178,90,.25)}
.dau .khung{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.logo-dau{width:40px;height:40px;flex:none}
.logo b{font:700 19px/1.1 var(--serif);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;font-size:11.5px;color:#cdb98f;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dau .phai{margin-left:auto;display:flex;gap:8px}
.dau .nut{height:38px;padding:0 14px;font-size:14px}
@media(max-width:640px){.dau .phai .chu-nut{display:none}.dau .nut{width:38px;padding:0}}

/* ---------- bảng giá ---------- */
.hero{background:radial-gradient(1200px 400px at 80% -10%,rgba(217,178,90,.28),transparent 60%),linear-gradient(180deg,var(--toi) 0%,var(--toi2) 100%);color:#f3e6c8;padding:26px 0 34px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,rgba(217,178,90,.6),transparent)}
.hero-luoi{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
@media(max-width:900px){.hero-luoi{grid-template-columns:1fr}}
.hero h1{font:800 30px/1.15 var(--serif);margin:0 0 4px}
.hero .cap{color:#cdb98f;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cham-song{width:8px;height:8px;border-radius:50%;background:#3fd17f;box-shadow:0 0 0 0 rgba(63,209,127,.7);animation:song 2s infinite}
@keyframes song{70%{box-shadow:0 0 0 9px rgba(63,209,127,0)}100%{box-shadow:0 0 0 0 rgba(63,209,127,0)}}
.bang-gia{margin-top:16px;border:1px solid rgba(217,178,90,.28);border-radius:var(--r);overflow:hidden;background:rgba(255,255,255,.03)}
.bg-dong{display:grid;grid-template-columns:1fr 128px 128px;align-items:center;padding:12px 16px;border-top:1px solid rgba(217,178,90,.14);cursor:pointer;transition:background .15s}
.bg-dong:hover,.bg-dong.chon{background:rgba(217,178,90,.09)}
.bg-dong.dau-bang{cursor:default;background:rgba(217,178,90,.12);border-top:0;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#d9c493;padding:9px 16px}
.bg-dong .ten{font-weight:600;color:#fbf1d9}
.bg-dong .so{text-align:right;font:700 17px/1.2 var(--sans);font-variant-numeric:tabular-nums;color:#fff}
.bg-dong .so.ban{color:var(--vangsang)}
.bg-dong .doi{display:block;font-size:11.5px;font-weight:600;margin-top:2px}
.doi.len{color:#4ade80}.doi.xuong{color:#ff7b7b}.doi.dung{color:#8f8170}
@media(max-width:520px){.bg-dong{grid-template-columns:1fr 104px 104px;padding:11px 12px}.bg-dong .so{font-size:15px}.hero h1{font-size:25px}}
.dvi{font-size:12px;color:#a8946e;margin-top:8px}
.bieu{background:rgba(255,255,255,.04);border:1px solid rgba(217,178,90,.22);border-radius:var(--r);padding:16px}
.bieu h3{margin:0;font:700 17px var(--serif);color:#fbf1d9}
.bieu .chon-ky{display:flex;gap:6px;margin:10px 0 6px}
.bieu .chon-ky button{padding:4px 11px;border-radius:999px;border:1px solid rgba(217,178,90,.3);color:#d9c493;font-size:12.5px}
.bieu .chon-ky button.chon{background:var(--vang-g);color:#2b1c06;border-color:transparent;font-weight:600}
.bieu svg{width:100%;height:190px;display:block}
.chu-chay{background:var(--vang-g);color:#2b1c06;font-weight:600;font-size:14px;overflow:hidden;white-space:nowrap}
.chu-chay span{display:inline-block;padding:8px 0 8px 100%;animation:chay 28s linear infinite}
@keyframes chay{to{transform:translateX(-100%)}}

/* ---------- danh mục ---------- */
.muc{padding:30px 0 6px}
.muc-dau{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.muc h2{font:800 25px/1.2 var(--serif);margin:0}
.muc h2 small{display:block;font:500 13px var(--sans);color:var(--mo);margin-top:4px}
.loc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--vien);background:#fff;font-size:14px;font-weight:500;white-space:nowrap}
.chip.chon{background:var(--toi);color:#f6e7c1;border-color:var(--toi)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex:1 1 100%}
.chips::-webkit-scrollbar{display:none}
.o-tim{position:relative;flex:1 1 220px}
.o-tim input{width:100%;height:42px;border-radius:999px;border:1.5px solid var(--vien);background:#fff;padding:0 16px 0 40px;outline:none}
.o-tim input:focus{border-color:var(--vang2)}
.o-tim svg{position:absolute;left:14px;top:12px;width:18px;height:18px;color:var(--mo)}
.loc select{height:42px;border-radius:999px;border:1.5px solid var(--vien);background:#fff;padding:0 12px;outline:none}
.luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
@media(max-width:560px){.luoi{grid-template-columns:1fr 1fr;gap:10px}}
.the{background:var(--the);border-radius:var(--r);overflow:hidden;box-shadow:var(--bong);border:1px solid #f1e9dc;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;display:flex;flex-direction:column;text-align:left}
.the:hover{transform:translateY(-3px);box-shadow:0 18px 38px -16px rgba(60,40,10,.35)}
.the .anh{aspect-ratio:1;background:#f6efe3;position:relative;overflow:hidden}
.the .anh img,.the .anh svg{width:100%;height:100%;object-fit:cover}
.the .nhan{position:absolute;left:10px;top:10px;background:rgba(26,18,12,.82);color:#f6e7c1;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px}
.the .nhan.ban{background:var(--do);color:#fff}
.the .tt{padding:11px 13px 13px;display:flex;flex-direction:column;gap:3px;flex:1}
.the .tt b{font-weight:600;font-size:15px;line-height:1.3}
.the .tt .phu{font-size:12.5px;color:var(--mo)}
.the .gia{margin-top:auto;padding-top:6px;font:700 17px var(--sans);color:var(--do);font-variant-numeric:tabular-nums}
.the .gia small{font:500 11px var(--sans);color:var(--mo);display:block}
.the.daban .anh{filter:grayscale(.6);opacity:.75}
.cuon{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,260px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-width:thin}
.cuon .the{scroll-snap-align:start}
.trong{padding:40px 16px;text-align:center;color:var(--mo);background:#fff;border-radius:var(--r);border:1px dashed var(--vien)}

/* ---------- tính giá ---------- */
.tinh{background:#fff;border-radius:var(--r);border:1px solid #f1e9dc;box-shadow:var(--bong);padding:18px;display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;gap:12px;align-items:end}
@media(max-width:860px){.tinh{grid-template-columns:1fr 1fr}}
.truong label{display:block;font-size:12.5px;color:var(--mo);margin-bottom:5px;font-weight:500}
.truong input,.truong select,.truong textarea{width:100%;height:44px;border-radius:12px;border:1.5px solid var(--vien);background:#fff;padding:0 12px;outline:none}
.truong textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.truong input:focus,.truong select:focus,.truong textarea:focus{border-color:var(--vang2);box-shadow:0 0 0 3px rgba(217,178,90,.18)}
.kq-tinh{background:var(--toi);color:#f6e7c1;border-radius:12px;padding:10px 14px;min-height:44px}
.kq-tinh b{font:700 21px var(--sans);color:var(--vangsang);display:block;font-variant-numeric:tabular-nums}
@media(max-width:860px){.kq-tinh{grid-column:1/-1}}

/* ---------- chân trang ---------- */
.chan{margin-top:40px;background:var(--toi);color:#d8c7a3;padding:34px 0 110px}
.chan .luoi-chan{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px}
@media(max-width:760px){.chan .luoi-chan{grid-template-columns:1fr}}
.chan h4{font:700 16px var(--serif);color:#fbf1d9;margin:0 0 10px}
.chan p{margin:6px 0;display:flex;gap:9px;align-items:flex-start}
.chan p svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--vang2)}
.chan a{color:#f3e2b8}
.chan .ql{color:#7d6c52;font-size:12.5px;text-decoration:none}
.thanh-duoi{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none;gap:10px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--vien)}
.thanh-duoi .nut{flex:1}
@media(max-width:760px){.thanh-duoi{display:flex}}

/* ---------- hộp chi tiết ---------- */
.man{position:fixed;inset:0;z-index:60;background:rgba(20,13,8,.62);display:flex;align-items:center;justify-content:center;padding:16px;animation:hien .18s}
@keyframes hien{from{opacity:0}}
.hop{background:#fff;border-radius:22px;width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;position:relative;animation:noi .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes noi{from{transform:translateY(16px) scale(.98);opacity:0}}
.hop.nho-hop{width:min(460px,100%)}
.dong-x{position:absolute;right:12px;top:12px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(0,0,0,.15);display:grid;place-items:center}
.dong-x svg{width:18px;height:18px}
.ct{display:grid;grid-template-columns:1.05fr 1fr}
@media(max-width:780px){.ct{grid-template-columns:1fr}.man{padding:0;align-items:flex-end}.hop{border-radius:22px 22px 0 0;max-height:94vh}}
.ct-anh{background:#f6efe3;position:relative}
.ct-anh .lon{aspect-ratio:1;overflow:hidden;display:flex;scroll-snap-type:x mandatory;overflow-x:auto;scrollbar-width:none}
.ct-anh .lon::-webkit-scrollbar{display:none}
.ct-anh .lon>*{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.ct-anh .nho-anh{display:flex;gap:8px;padding:10px;overflow-x:auto}
.ct-anh .nho-anh button{width:58px;height:58px;border-radius:10px;overflow:hidden;flex:none;border:2px solid transparent;padding:0;background:#fff}
.ct-anh .nho-anh button.chon{border-color:var(--vang)}
.ct-anh .nho-anh img,.ct-anh .nho-anh svg{width:100%;height:100%;object-fit:cover}
.ct-tt{padding:26px 24px 22px;display:flex;flex-direction:column;gap:12px}
.ct-tt h2{font:800 25px/1.2 var(--serif);margin:0;padding-right:36px}
.ct-gia{background:linear-gradient(135deg,#fff8e6,#fbefd0);border:1px solid #f0dca8;border-radius:14px;padding:12px 14px}
.ct-gia b{font:800 27px var(--sans);color:var(--do);font-variant-numeric:tabular-nums}
.ct-gia .nho{margin-top:3px}
.bang-tt{width:100%;border-collapse:collapse;font-size:14px}
.bang-tt td{padding:8px 0;border-bottom:1px dashed var(--vien)}
.bang-tt td:last-child{text-align:right;font-weight:600}
.ct-nut{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.ct-nut .nut{width:100%}
.ct-nut .ca{grid-column:1/-1}
.mo-ta{white-space:pre-line;color:#4a3d32;margin:0}
.thong-bao{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:var(--toi);color:#f6e7c1;padding:11px 18px;border-radius:999px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw;text-align:center;animation:hien .2s}

/* ---------- màn hình TV tại cửa hàng ---------- */
body.tv{background:#0e0905;overflow:hidden}
#tv{position:fixed;inset:0;color:#f3e6c8;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(1400px 600px at 70% -20%,rgba(217,178,90,.25),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(155,28,28,.28),transparent 60%),#120c07}
.tv-dau{display:flex;align-items:center;gap:1.4vw;padding:1.6vw 2.4vw 1vw}
.tv-dau .logo-dau{width:4.2vw;height:4.2vw;min-width:44px;min-height:44px}
.tv-dau h1{margin:0;font:800 clamp(24px,2.9vw,58px)/1.05 var(--serif)}
.tv-dau .kh{color:#cdb98f;font-size:clamp(13px,1.15vw,22px)}
.tv-gio{margin-left:auto;text-align:right}
.tv-gio b{font:700 clamp(26px,3.2vw,64px)/1 var(--sans);font-variant-numeric:tabular-nums;color:#fff}
.tv-gio div{color:#cdb98f;font-size:clamp(13px,1.1vw,22px);margin-top:.3vw}
.tv-giua{display:grid;grid-template-columns:1.35fr 1fr;gap:1.8vw;padding:0 2.4vw 1.2vw;min-height:0}
.tv-bang{border:1px solid rgba(217,178,90,.35);border-radius:1.4vw;overflow:hidden;display:flex;flex-direction:column;background:rgba(0,0,0,.25)}
.tv-bang .hang{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);column-gap:1.4vw;align-items:center;padding:0 1.6vw;flex:1;border-top:1px solid rgba(217,178,90,.16);min-height:0}
.tv-bang .hang.tieu{flex:0 0 auto;padding:.9vw 1.6vw;background:rgba(217,178,90,.14);border-top:0;font-size:clamp(12px,1.05vw,20px);letter-spacing:.12em;text-transform:uppercase;color:#e6cf97;font-weight:600}
.tv-bang .hang .t{font:600 clamp(14px,1.6vw,34px)/1.15 var(--sans);color:#fbf1d9}
.tv-bang .hang .s{text-align:right;font:800 clamp(17px,2.15vw,46px)/1 var(--sans);font-variant-numeric:tabular-nums;color:#fff}
.tv-bang .hang .s.b{color:var(--vangsang)}
.tv-bang .hang .s i{display:block;font:600 clamp(10px,.85vw,17px) var(--sans);font-style:normal;margin-top:.35vw}
.tv-bang .hang:nth-child(even):not(.tieu){background:rgba(255,255,255,.025)}
.tv-chu{padding:.7vw 1.6vw;color:#a8946e;font-size:clamp(11px,.9vw,18px);border-top:1px solid rgba(217,178,90,.16)}
.tv-trinh{position:relative;border-radius:1.4vw;overflow:hidden;border:1px solid rgba(217,178,90,.35);background:#1b130c;min-height:0}
.tv-trinh .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;display:flex;flex-direction:column}
.tv-trinh .slide.hien{opacity:1}
.tv-trinh .slide .hinh{flex:1;min-height:0;overflow:hidden}
.tv-trinh .slide .hinh>*{width:100%;height:100%;object-fit:cover;animation:keo 9s ease-out both}
@keyframes keo{from{transform:scale(1.08)}to{transform:scale(1)}}
.tv-trinh .slide .chu{position:absolute;left:0;right:0;bottom:0;padding:3vw 1.6vw 1.4vw;background:linear-gradient(transparent,rgba(10,6,3,.92))}
.tv-trinh .slide .chu b{display:block;font:700 clamp(18px,2vw,40px)/1.2 var(--serif);color:#fff}
.tv-trinh .slide .chu span{font:700 clamp(16px,1.8vw,36px) var(--sans);color:var(--vangsang)}
.tv-trinh .slide .chu small{display:block;color:#d8c7a3;font-size:clamp(11px,1vw,20px);margin-top:.3vw}
.tv-qr{position:absolute;right:1vw;top:1vw;background:#fff;border-radius:.8vw;padding:.6vw;text-align:center;color:#2a1f17;font-size:clamp(9px,.75vw,15px);font-weight:600;z-index:2;width:clamp(90px,9vw,180px)}
.tv-qr canvas,.tv-qr img{width:100%!important;height:auto!important}
.tv-chan .chu-chay{font-size:clamp(14px,1.45vw,30px)}
.tv-chan .chu-chay span{padding:.7vw 0 .7vw 100%;animation-duration:40s}
.tv-nut{position:fixed;right:16px;bottom:70px;z-index:5;opacity:.0;transition:opacity .3s}
#tv:hover .tv-nut{opacity:1}
@media(max-aspect-ratio:1/1){.tv-giua{grid-template-columns:1fr;grid-template-rows:1.2fr 1fr}}

/* ---------- quản lý ---------- */
body.ql-mo{background:#f4efe6}
.ql-dau{background:var(--toi);color:#f3e6c8}
.ql-dau .khung{display:flex;align-items:center;gap:12px;height:60px}
.ql-tab{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:#fff;border-bottom:1px solid var(--vien);position:sticky;top:0;z-index:20}
.ql-tab .khung{display:flex;gap:4px}
.ql-tab button{padding:14px 14px 12px;font-weight:600;color:var(--mo);border-bottom:3px solid transparent;white-space:nowrap;position:relative}
.ql-tab button.chon{color:var(--chu);border-color:var(--vang)}
.dem{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--do);color:#fff;font-size:11px;margin-left:4px}
.ql-than{padding:18px 0 80px}
.ql-the{background:#fff;border-radius:var(--r);border:1px solid #efe5d5;padding:16px;margin-bottom:14px}
.ql-the h3{margin:0 0 12px;font:700 18px var(--serif);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ql-the h3 .phai{margin-left:auto;display:flex;gap:8px}
.ql-the h3 .nut{height:38px;font:600 14px var(--sans)}
.gia-sua{width:100%;border-collapse:collapse}
.gia-sua th{font-size:12px;color:var(--mo);text-align:left;font-weight:600;padding:0 6px 8px}
.gia-sua td{padding:5px 4px;vertical-align:middle}
.gia-sua input[type=text],.gia-sua input[inputmode]{width:100%;height:42px;border:1.5px solid var(--vien);border-radius:10px;padding:0 10px;outline:none;background:#fff}
.gia-sua input.so{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.gia-sua input:focus{border-color:var(--vang2)}
.gia-sua .nho-nut{width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;color:var(--mo)}
.gia-sua .nho-nut:hover{background:#f4ede1;color:var(--chu)}
.gia-sua .nho-nut svg{width:16px;height:16px}
@media(max-width:700px){
 .gia-sua thead{display:none}.gia-sua tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--vien)}
 .gia-sua td{padding:0}.gia-sua td.c-ten{grid-column:1/-1}.gia-sua td.c-nut{grid-column:1/-1;display:flex;gap:4px;align-items:center}
 .gia-sua td[data-n]:before{content:attr(data-n);display:block;font-size:11.5px;color:var(--mo);margin-bottom:2px}}
.ds-sp{display:flex;flex-direction:column}
.ds-sp .dong{display:flex;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid #f1e9dc;cursor:pointer}
.ds-sp .dong:hover{background:#fcf9f3}
.ds-sp .dong .tn{width:56px;height:56px;border-radius:10px;overflow:hidden;flex:none;background:#f6efe3}
.ds-sp .dong .tn>*{width:100%;height:100%;object-fit:cover}
.ds-sp .dong .g{margin-left:auto;text-align:right;font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:#eef6f0;color:#13703f}
.tag.an{background:#f1f1f1;color:#666}.tag.daban{background:#fde8e8;color:var(--do)}.tag.nb{background:#fff4d6;color:#8a5d00}
.luoi-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.luoi-form .ca{grid-column:1/-1}
@media(max-width:600px){.luoi-form{grid-template-columns:1fr}}
.anh-sua{display:flex;gap:10px;flex-wrap:wrap}
.anh-sua .o{width:92px;height:92px;border-radius:12px;overflow:hidden;position:relative;background:#f6efe3;border:2px solid transparent}
.anh-sua .o.dau{border-color:var(--vang)}
.anh-sua .o>img,.anh-sua .o>svg{width:100%;height:100%;object-fit:cover}
.anh-sua .o .x{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;text-align:center}
.anh-sua .o .d{position:absolute;left:4px;bottom:4px;font-size:10.5px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:1px 5px}
.anh-sua label.them{width:92px;height:92px;border-radius:12px;border:2px dashed #d8c7a3;display:grid;place-items:center;text-align:center;color:var(--mo);font-size:12px;cursor:pointer}
.gat{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.gat input{display:none}
.gat i{width:44px;height:26px;border-radius:999px;background:#d9d1c4;position:relative;transition:background .2s;flex:none}
.gat i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.gat input:checked+i{background:var(--vang)}
.gat input:checked+i:after{transform:translateX(18px)}
.phan-doan{display:inline-flex;background:#f1ebe0;border-radius:999px;padding:3px}
.phan-doan button{padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--mo)}
.phan-doan button.chon{background:#fff;color:var(--chu);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.giu{border:1px solid #efe5d5;border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff}
.giu.moi{border-color:#f0c873;background:#fffaf0}
.giu .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.giu .h b{font-size:15.5px}
.giu .nuts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.giu .nuts .nut{height:34px;font-size:13px;padding:0 12px}
.dn{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 80% 0%,rgba(217,178,90,.3),transparent 60%),var(--toi)}
.dn-hop{background:#fff;border-radius:24px;padding:28px 24px;width:min(380px,100%);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.dn-hop h2{font:800 22px var(--serif);margin:10px 0 2px}
.o-pin{display:flex;justify-content:center;gap:10px;margin:18px 0}
.o-pin i{width:16px;height:16px;border-radius:50%;border:2px solid #cdb98f}
.o-pin i.co{background:var(--vang);border-color:var(--vang)}
.phim{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.phim button{height:58px;border-radius:16px;background:#f6f1e8;font:600 22px var(--sans)}
.phim button:active{background:#ecdfc6}
.loi{color:var(--xuong);font-size:13.5px;min-height:20px;margin-top:8px}
.tai{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:xoay .7s linear infinite;vertical-align:-3px}
@keyframes xoay{to{transform:rotate(360deg)}}
.khung-cho{display:grid;place-items:center;min-height:60vh;color:var(--mo)}
@media print{.dau,.thanh-duoi,.chan{display:none}}
